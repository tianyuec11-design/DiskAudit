name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.label }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: PowerShell 7
            exe: pwsh
            flag: -NoProfile
          - label: Windows PowerShell 5.1
            exe: powershell
            flag: -NoProfile

    steps:
      - uses: actions/checkout@v4

      - name: Show host info
        run: |
          Write-Host "runner: $env:RUNNER_OS / $env:RUNNER_IMAGE_OS"
          $PSVersionTable | Out-String | Write-Host

      - name: Run test suite
        run: ${{ matrix.exe }} ${{ matrix.flag }} -ExecutionPolicy Bypass -File ./tests/run-tests.ps1

  lint:
    name: lint (PSScriptAnalyzer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Analyse module and CLI
        run: |
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
          if ($results) {
            $results | Format-Table -AutoSize | Out-String | Write-Host
            exit 1
          }
          Write-Host 'No errors reported.'

  smoke:
    name: smoke (real snapshot)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Take a baseline snapshot
        run: ./bin/disk-audit.ps1 -Profile quick -NoCompare -SaveSnapshot -OutFile ./out/snapshot.json

      - name: Check the payload
        run: |
          $snap = Get-Content ./out/snapshot.json -Raw | ConvertFrom-Json
          if ($snap.kind -ne 'snapshot') { throw 'unexpected kind' }
          if (-not $snap.entries) { throw 'no entries produced' }
          if ($snap.volume.totalBytes -le 0) { throw 'bad volume size' }
          Write-Host ("entries={0} hotspots={1} findings={2}" -f @($snap.entries).Count, @($snap.hotspots).Count, @($snap.findings).Count)

      - name: Second run must produce a report
        run: |
          ./bin/disk-audit.ps1 -Profile quick -Format markdown -OutFile ./out/report.md
          if (-not (Test-Path ./out/report.md)) { throw 'report not written' }
          Get-Content ./out/report.md | Select-Object -First 12
